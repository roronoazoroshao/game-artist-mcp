name: ci

on:
  push:
    branches:
      - main
      - "poc/**"
      - "docs/**"
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      FOLDERFORGE_SHA: 59c1096167a81bef24a07fa88453f5c50e0fe64a
      GODOT_VERSION: 4.7.2-stable
      GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      GODOT_BIN: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --version
          test "$(rsvg-convert --version)" = "rsvg-convert version 2.58.0"

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Audit PNG codec dependencies
        run: npm audit --omit=dev

      - name: Run unit tests
        run: npm test

      - name: Check POC-005C2 provider capability (fail-closed)
        run: npm run poc:005c2:capabilities

      - name: Run POC-005C2 synthetic provenance rehearsal (not live evidence)
        run: npm run poc:005c2:audit:dry

      - name: Audit synthetic POC-005A evidence (NOT agent-origin proof)
        run: npm run audit:poc005a

      - name: Render POC-001 fixture
        env:
          REQUIRE_PNG: "1"
        run: npm run poc

      - name: Run direct MCP POC-002 smoke
        run: npm run smoke:mcp

      - name: Render POC-003 Spirit Lantern draft
        run: npm run poc:003

      - name: Assert POC-003 draft evidence
        run: |
          test -s examples/spirit-lantern/generated/draft.png
          test -s examples/spirit-lantern/generated/draft.svg
          test -s examples/spirit-lantern/generated/technical-report-draft.json
          test -s examples/spirit-lantern/generated/corrected.png
          test -s examples/spirit-lantern/generated/corrected.svg
          test -s examples/spirit-lantern/generated/technical-report-corrected.json
          test -s examples/spirit-lantern/generated/benchmark.json
          grep -q '"visualReview": "PASSED_VISUAL_LOOP"' examples/spirit-lantern/generated/benchmark.json

      - name: Render POC-005B technical material A/B (not artistic evidence)
        run: npm run poc:005b

      - name: Render POC-005B 3 real-geometry blinded A/B pairs (technical only)
        run: npm run poc:005b:real

      - name: Render held-out compass same-geometry 64/128 blind A/B (UNSCORED)
        run: npm run poc:005b:heldout

      - name: Generate POC-005C1 UNSCORED human blind review kit (technical-only)
        run: npm run poc:005c1:dry

      - name: Generate POC-004 Godot cutout project
        run: npm run poc:004

      - name: Install pinned Godot
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            -o /tmp/godot.zip
          echo "${GODOT_SHA256}  /tmp/godot.zip" | sha256sum -c -
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version

      - name: Verify generated Godot project headlessly
        run: |
          "${GODOT_BIN}" --headless --path examples/spirit-lantern/generated/godot --editor --quit 2>&1 | tee examples/spirit-lantern/generated/godot-import.log
          "${GODOT_BIN}" --headless --path examples/spirit-lantern/generated/godot 2>&1 | tee examples/spirit-lantern/generated/godot-run.log
          grep -q "GAME_ARTIST_POC004_OK" examples/spirit-lantern/generated/godot-run.log

      - name: Generate Phase 3 actual preview and Godot project
        run: npm run poc:phase3

      - name: Verify Phase 3 animated atlas in pinned Godot
        run: |
          "${GODOT_BIN}" --headless --path examples/spirit-lantern/generated/phase3-godot --editor --quit 2>&1 | tee examples/spirit-lantern/generated/phase3-import.log
          "${GODOT_BIN}" --headless --path examples/spirit-lantern/generated/phase3-godot --scene res://main.tscn 2>&1 | tee examples/spirit-lantern/generated/phase3-run.log
          grep -q "GAME_ARTIST_PHASE3_OK" examples/spirit-lantern/generated/phase3-run.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:|WARNING:" examples/spirit-lantern/generated/phase3-import.log examples/spirit-lantern/generated/phase3-run.log

      - name: Capture actual R7 in-game Godot screenshots and verify rendered pixels
        run: |
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          LIBGL_ALWAYS_SOFTWARE=1 timeout 90s xvfb-run -a --server-args="-screen 0 1024x768x24" "${GODOT_BIN}" --audio-driver Dummy --rendering-driver opengl3 --path examples/spirit-lantern/generated/phase3-godot --scene res://showcase.tscn -- --capture-showcase 2>&1 | tee examples/spirit-lantern/generated/r7-showcase-run.log
          grep -q "GAME_ARTIST_R7_SHOWCASE_OK" examples/spirit-lantern/generated/r7-showcase-run.log
          R7_CAPTURE_VERIFICATION=1 node --test test/r7-showcase-framebuffer.test.mjs
          R8_CAPTURE_VERIFICATION=1 node --test test/r8-showcase-temporal.test.mjs
          # Mesa llvmpipe on Xvfb lacks VSync controls; this exact driver notice
          # does not indicate a rendering failure. All other warnings/errors fail.
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:|WARNING:" examples/spirit-lantern/generated/r7-showcase-run.log | grep -vF "WARNING: Could not set V-Sync mode, as changing V-Sync mode is not supported by the graphics driver."; then
            exit 1
          fi

      - name: Capture R8 real Godot light-on/off and assert local environment response
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 timeout 90s xvfb-run -a --server-args="-screen 0 1024x768x24" "${GODOT_BIN}" --audio-driver Dummy --rendering-driver opengl3 --path examples/spirit-lantern/generated/phase3-godot --scene res://showcase.tscn -- --capture-r8-light-probe 2>&1 | tee examples/spirit-lantern/generated/r8-light-run.log
          grep -q "GAME_ARTIST_R8_LIGHT_PROBE_OK" examples/spirit-lantern/generated/r8-light-run.log
          R8_CAPTURE_VERIFICATION=1 node --test test/r8-showcase-light-response.test.mjs
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:|WARNING:" examples/spirit-lantern/generated/r8-light-run.log | grep -vF "WARNING: Could not set V-Sync mode, as changing V-Sync mode is not supported by the graphics driver."; then
            exit 1
          fi

      - name: Build exact FolderForge integration fixture
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/roronoazoroshao369/FolderForge.git ../FolderForge
          cd ../FolderForge
          git checkout "$FOLDERFORGE_SHA"
          npm ci --ignore-scripts
          npm run build

      - name: Validate FolderForge plugin package
        run: node ../FolderForge/dist/main.js plugin validate "$GITHUB_WORKSPACE" --json

      - name: Start through FolderForge child-MCP client
        run: node ../FolderForge/dist/main.js plugin test "$GITHUB_WORKSPACE" --call health --args-json '{}' --json

      - name: Assert generated POC-001 artifacts
        run: |
          test -s examples/jade-spirit-stone/generated/jade-spirit-stone.svg
          test -s examples/jade-spirit-stone/generated/jade-spirit-stone.png
          test -s examples/jade-spirit-stone/generated/report.json

      - uses: actions/upload-artifact@v4
        with:
          name: poc-005b-technical-ab
          path: |
            benchmarks/poc005b/generated/A*
            benchmarks/poc005b/generated/B*
            benchmarks/poc005b/generated/review.html
            benchmarks/poc005b/generated/technical-report.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: poc-005b-real-assets-blind-review-UNSCORED
          path: benchmarks/poc005b/generated/real-asset-ab/review/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: poc-005b-heldout-compass-UNSCORED
          path: benchmarks/poc005b/generated/heldout-compass/review/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: poc-005c1-blind-review-UNSCORED
          path: benchmarks/poc005c1/generated/review/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: poc-001-jade-spirit-stone
          path: examples/jade-spirit-stone/generated/

      - uses: actions/upload-artifact@v4
        with:
          name: poc-003-spirit-lantern-draft
          path: examples/spirit-lantern/generated/

      - uses: actions/upload-artifact@v4
        with:
          name: poc-004-godot-spirit-lantern
          path: |
            examples/spirit-lantern/generated/godot/
            examples/spirit-lantern/generated/godot-import.log
            examples/spirit-lantern/generated/godot-run.log

      - uses: actions/upload-artifact@v4
        with:
          name: phase3-spirit-lantern-visual-UNSCORED
          path: examples/spirit-lantern/generated/phase3-review/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: r7-spirit-lantern-Godot-gameplay-UNSCORED
          path: |
            examples/spirit-lantern/generated/phase3-godot/r7-showcase-review/
            examples/spirit-lantern/generated/r7-showcase-run.log
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r8-spirit-lantern-Godot-light-probe-UNSCORED
          path: |
            examples/spirit-lantern/generated/phase3-godot/r8-light-probe/
            examples/spirit-lantern/generated/r8-light-run.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: phase3-spirit-lantern-Godot-runtime
          path: |
            examples/spirit-lantern/generated/phase3-godot/
            examples/spirit-lantern/generated/phase3-import.log
            examples/spirit-lantern/generated/phase3-run.log
          if-no-files-found: error
